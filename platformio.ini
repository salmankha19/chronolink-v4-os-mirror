[platformio]
default_envs = single_mcu
src_dir = main
extra_configs = platformio.local.ini

[env:single_mcu]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
build_flags =
  -I components/chronolink_hal/include

board_build.filesystem = fatfs

; ---------------------------------------------------------------
; Test-harness firmware (session 5.7).
; Identical to single_mcu except for CHRONOLINK_TEST_HOOKS, which
; compiles the GET /debug/ntp test hook into svc_http. This is a
; plain macro, NOT a CONFIG_* option (see .clinerules: never fake
; CONFIG_* macros in build_flags) and there is no Kconfig entry.
; The production env above never defines it, so the handler and the
; "/debug/ntp" string are absent from that image.
; ---------------------------------------------------------------
[env:single_mcu_test]
extends = env:single_mcu
build_flags =
  ${env:single_mcu.build_flags}
  -DCHRONOLINK_TEST_HOOKS=1