name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  platformio-build:
    name: PlatformIO build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [single_mcu, single_mcu_test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        # Pin the version so a new PIO release cannot silently change what
        # CI builds. Bump deliberately after checking `pio --version` locally.
        run: python -m pip install -U "platformio==6.2.0"

      - name: Build ${{ matrix.env }}
        run: python -m platformio run -e ${{ matrix.env }}
        working-directory: ${{ github.workspace }}

      - name: Verify production image has no /debug/ntp route
        if: matrix.env == 'single_mcu'
        run: |
          # The /debug/ntp route is compiled only under
          # CONFIG_CHRONOLINK_TEST_HOOKS / CHRONOLINK_TEST_HOOKS, which
          # only env:single_mcu_test defines. Grepping the linked ELF for
          # the route string is the only check that the #if guard actually
          # removed the handler from the production image.
          if strings .pio/build/single_mcu/firmware.elf | grep -q "debug/ntp"; then
            echo "FAIL: /debug/ntp route present in production image"
            exit 1
          fi
          echo "OK: /debug/ntp route not present in production image"

      - name: Upload firmware (single_mcu, tags and manual only)
        if: success() && matrix.env == 'single_mcu' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: platformio-firmware-${{ github.sha }}
          path: |
            .pio/build/**/firmware.bin
            .pio/build/**/firmware.elf
          retention-days: 7

  esp-idf-build:
    name: ESP-IDF build (esp32s3)
    runs-on: ubuntu-latest
    needs: platformio-build
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build ccache

      - name: Setup ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: 'v6.0.1'

      - name: Show IDF version
        run: idf.py --version

      - name: Build with idf.py
        run: |
          idf.py set-target esp32s3
          idf.py build
        working-directory: ${{ github.workspace }}

      - name: Upload firmware (tags and manual only)
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: esp-idf-firmware-${{ github.sha }}
          path: |
            build/chronolink_v4_os.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          retention-days: 7

  host-prayer-tests:
    name: Prayer host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run golden + wrapper tests
        run: make -C prayer_host_tests test

      - name: Run invariants
        run: make -C prayer_host_tests test-highlat