name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  platformio-build:
    name: PlatformIO build (single_mcu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install -U platformio

      - name: Build single_mcu
        run: python -m platformio run -e single_mcu
        working-directory: ${{ github.workspace }}

      - name: Upload firmware (tags and manual only)
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: platformio-firmware-${{ github.sha }}
          path: |
            .pio/build/**/firmware.bin
            .pio/build/**/firmware.elf
          retention-days: 7

  esp-idf-build:
    name: ESP-IDF build (esp32s3)
    runs-on: ubuntu-latest
    needs: platformio-build
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build ccache

      - name: Setup ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: 'v6.0.2'

      - name: Show IDF version
        run: idf.py --version

      - name: Build with idf.py
        run: |
          idf.py set-target esp32s3
          idf.py build
        working-directory: ${{ github.workspace }}

      - name: Upload firmware (tags and manual only)
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: esp-idf-firmware-${{ github.sha }}
          path: |
            build/chronolink_v4_os.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          retention-days: 7

  host-prayer-tests:
    name: Prayer host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run golden + wrapper tests
        run: make -C prayer_host_tests test

      - name: Run invariants
        run: make -C prayer_host_tests test-highlat