name: CI

on: [push, pull_request]

jobs:
  platformio-build:
    name: PlatformIO build (single_mcu, split_mcu_main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install -U platformio

      - name: Build single_mcu
        run: python -m platformio run -e single_mcu
        working-directory: ${{ github.workspace }}

      - name: Build split_mcu_main
        run: python -m platformio run -e split_mcu_main
        working-directory: ${{ github.workspace }}

      - name: Upload PlatformIO artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: platformio-artifacts
          path: |
            .pio/build/**/firmware.bin
            .pio/build/**/firmware.hex
            .pio/build/**/firmware.elf

  esp-idf-build:
    name: ESP-IDF build (esp32s3)
    runs-on: ubuntu-latest
    needs: platformio-build
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build ccache

      - name: Setup ESP-IDF (uses espressif action)
        uses: espressif/esp-idf-action@v2
        with:
          version: 'v6.0.2'
          target: 'esp32s3'

      - name: Show IDF version
        run: idf.py --version

      - name: Build with idf.py
        run: |
          idf.py set-target esp32s3
          idf.py build
        working-directory: ${{ github.workspace }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chronolink-esp-idf
          path: |
            build/chronolink_v4_os.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/chronolink_v4_os.elf
            build/chronolink_v4_os.map