name: CI

on: [push, pull_request]

jobs:
  platformio-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: python -m pip install -U platformio

      - name: Build single_mcu
        run: python -m platformio run -e single_mcu

      - name: Build split_mcu_main
        run: python -m platformio run -e split_mcu_main

      - name: Upload PlatformIO artifacts (optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: platformio-artifacts
          path: |
            .pio/build/**/firmware.bin
            .pio/build/**/firmware.hex

  esp-idf-build:
    runs-on: ubuntu-latest
    needs: platformio-build
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip python3-setuptools cmake ninja-build ccache git-lfs
          git lfs install

      - name: Install ESP-IDF tools (esp-idf v6.x)
        env:
          IDF_VERSION: 'v6.0.2'
        run: |
          set -e
          # Retry clone up to 3 times to avoid transient network failures
          for i in 1 2 3; do
            git clone --depth 1 --branch "${IDF_VERSION}" https://github.com/espressif/esp-idf.git "$HOME/esp-idf" && break || sleep 5
          done
          "$HOME/esp-idf/install.sh" esp32s3

      - name: Show IDF version
        run: |
          source $HOME/esp-idf/export.sh
          idf.py --version

      - name: Ensure CMake sees renamed folders (optional)
        run: |
          echo "Ensure EXTRA_COMPONENT_DIRS is set in CMakeLists.txt if required"

      - name: Build with idf.py
        run: |
          source $HOME/esp-idf/export.sh
          idf.py build
        working-directory: ${{ github.workspace }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chronolink-binaries
          path: |
            build/chronolink_v4_os.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
